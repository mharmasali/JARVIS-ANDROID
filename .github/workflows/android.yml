name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build JARVIS APK
        env:
          JARVIS_AI_BASE_URL: ${{ secrets.JARVIS_AI_BASE_URL }}
          JARVIS_AI_API_KEY: ${{ secrets.JARVIS_AI_API_KEY }}
          JARVIS_AI_MODEL: ${{ secrets.JARVIS_AI_MODEL }}
        run: |
          gradle assembleDebug \
            -PJARVIS_AI_BASE_URL="$JARVIS_AI_BASE_URL" \
            -PJARVIS_AI_API_KEY="$JARVIS_AI_API_KEY" \
            -PJARVIS_AI_MODEL="$JARVIS_AI_MODEL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
